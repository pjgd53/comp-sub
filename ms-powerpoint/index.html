<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — MS PowerPoint Lessons</title>
<style>
  :root {
    --bg1: #eef2ff; --bg2: #f8fafc; --card: #ffffff;
    --card-border: rgba(15,23,42,0.06); --ink: #1e293b; --muted: #64748b;
    --accent: #6366f1; --shadow: rgba(15,23,42,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #1e1b4b; --bg2: #0f172a; --card: #1a2036;
      --card-border: rgba(255,255,255,0.08); --ink: #e7ecff; --muted: #94a3b8;
      --accent: #818cf8; --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg1: #1e1b4b; --bg2: #0f172a; --card: #1a2036;
    --card-border: rgba(255,255,255,0.08); --ink: #e7ecff; --muted: #94a3b8;
    --accent: #818cf8; --shadow: rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 16px; color: var(--ink);
    transition: background 0.2s, color 0.2s;
  }
  .theme-toggle {
    position: fixed; top: 14px; right: 14px; width: 42px; height: 42px;
    border-radius: 50%; background: var(--card); border: 1px solid var(--card-border);
    box-shadow: 0 4px 14px var(--shadow); font-size: 19px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; z-index: 20; padding: 0;
  }
  .theme-toggle:active { transform: scale(0.92); }

  body { justify-content: center; }
  .box {
    width: 100%; max-width: 440px; text-align: center; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 20px; padding: 36px 24px;
    box-shadow: 0 8px 24px var(--shadow);
  }
  .code { font-size: clamp(56px, 18vw, 84px); font-weight: 800; color: var(--accent); line-height: 1; margin: 0; letter-spacing: -2px; }
  .emoji { font-size: 2.2rem; margin: 14px 0 6px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  .bar { height: 8px; border-radius: 999px; background: var(--bg1); overflow: hidden; margin: 0 auto 26px; max-width: 240px; }
  .bar span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 999px; animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 40%; } }
  a.btn {
    display: inline-block; padding: 11px 20px; border-radius: 999px; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 14px; text-decoration: none;
  }
  a.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">🌙</button>
<div class="box">
  <p class="code">404</p>
  <div class="emoji">🚧</div>
  <h1>📊 MS PowerPoint Lessons — Work in Progress</h1>
  <p>This page isn't ready yet. Your teacher is still building these lessons. Check back soon!</p>
  <div class="bar"><span></span></div>
  <a class="btn" href="../index.html">← Back to Home</a>
</div>
<script>
(function () {
  const KEY = 'msWordLessonsTheme';
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  function eff() {
    const x = root.getAttribute('data-theme');
    if (x) return x;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function icon() {
    const d = eff() === 'dark';
    btn.textContent = d ? '☀️' : '🌙';
    btn.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode');
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  icon();
  btn.addEventListener('click', () => {
    const t = eff() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t); icon();
    try { localStorage.setItem(KEY, t); } catch (e) {}
  });
})();
</script>

</body>
</html>
